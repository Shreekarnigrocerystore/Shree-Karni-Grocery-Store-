<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shree Karni — Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:#203027;font-family:Arial,sans-serif}header{background:#145b3b;color:white;padding:17px 20px}main{max-width:1100px;margin:auto;padding:20px}.box{background:white;border:1px solid #e3ebe5;border-radius:14px;padding:17px;margin:14px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:9px 0}label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #dce6df;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;padding:11px 14px;background:#176b45;color:white;font-weight:bold;cursor:pointer}.secondary{background:#edf5ef;color:#145b3b}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{background:#eaf2ec;color:#145b3b}.tab.active{background:#176b45;color:white}.item{border:1px solid #e4ece6;border-radius:10px;padding:12px;margin:9px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{font-size:12px;color:#718076;line-height:1.5}.hide{display:none}.status{padding:5px 8px;border-radius:20px;background:#fff2d6;font-size:12px}button{cursor:pointer}@media(max-width:600px){.row{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><header><b>Shree Karni Grocery Store</b> — Admin Panel</header><main>
<section class="box" id="loginBox"><h2>Admin Login</h2><p class="muted">Sign in with the admin email and password created in Firebase Authentication.</p><form id="login"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn">Login</button></form><p id="loginError" class="muted"></p></section>
<section id="dashboard" class="hide"><div class="box" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>Dashboard</b><div class="muted" id="who"></div></div><button class="btn secondary" onclick="logout()">Logout</button></div>
<div class="box"><div class="tabs"><button class="btn tab active" onclick="tab('orders',this)">Orders</button><button class="btn tab" onclick="tab('products',this)">Products</button></div><div id="content"></div></div></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<script>
let auth,db,ordersCache=[],productsCache=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function init(){if(!window.firebaseConfig||firebaseConfig.apiKey==="YOUR_API_KEY"){document.getElementById("loginError").textContent="Firebase setup pending. Complete the setup in README first.";return}firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();auth.onAuthStateChanged(u=>{document.getElementById("loginBox").classList.toggle("hide",!!u);document.getElementById("dashboard").classList.toggle("hide",!u);if(u){document.getElementById("who").textContent=u.email;tab("orders",document.querySelector(".tab"))}})}
document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();let f=new FormData(e.target);try{await auth.signInWithEmailAndPassword(f.get("email"),f.get("password"));document.getElementById("loginError").textContent=""}catch(err){document.getElementById("loginError").textContent="Login failed: "+err.message}});
function logout(){auth.signOut()}
function tab(which,el){document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));if(el)el.classList.add("active");let c=document.getElementById("content");if(which==="orders"){c.innerHTML="<h2>Customer Orders</h2><div id='ordersList'>Loading...</div>";db.collection("orders").orderBy("createdAt","desc").limit(300).onSnapshot(s=>{ordersCache=s.docs.map(d=>({id:d.id,...d.data()}));document.getElementById("ordersList").innerHTML=ordersCache.length?ordersCache.map(o=>`<article class="item"><div><b>${esc(o.customerName)} · ${esc(o.phone)}</b><div class="muted">Order: ${esc(o.id)} · ${esc(o.fulfilment)} · ${esc(o.address||"")}</div><div class="muted">${(o.items||[]).map(i=>esc(i.name)+" × "+i.quantity+" ("+Number(i.price*i.quantity)+")").join("<br>")}</div><b>₹${Number(o.total||0).toLocaleString("en-IN")}</b><div class="muted">${esc(o.payment||"")} · ${esc(o.note||"")}</div></div><div><span class="status">${esc(o.status||"New")}</span><select onchange="status('${o.id}',this.value)" style="margin-top:8px"><option ${o.status==="New"?"selected":""}>New</option><option ${o.status==="Accepted"?"selected":""}>Accepted</option><option ${o.status==="Preparing"?"selected":""}>Preparing</option><option ${o.status==="Ready"?"selected":""}>Ready</option><option ${o.status==="Out for delivery"?"selected":""}>Out for delivery</option><option ${o.status==="Completed"?"selected":""}>Completed</option><option ${o.status==="Cancelled"?"selected":""}>Cancelled</option></select></div></article>`).join(""):"<p>No orders received yet.</p>"},e=>{document.getElementById("ordersList").textContent="Could not load orders: "+e.message})}
if(which==="products"){c.innerHTML=`<h2>Add a Product</h2><form id="productForm"><div class="row"><div class="field"><label>Product name *</label><input name="name" required></div><div class="field"><label>Category *</label><select name="category">${["Atta & Rice","Dal & Pulses","Oil & Ghee","Snacks & Biscuits","Cold Drinks","Personal Care","Household","Masala & Spices"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Price (₹) *</label><input name="price" type="number" min="0" step=".01" required></div><div class="field"><label>Stock quantity</label><input name="stock" type="number" min="0" value="100"></div><div class="field"><label>Emoji</label><input name="emoji" placeholder="🛒"></div><div class="field"><label>Product image URL (optional)</label><input name="image" type="url"></div></div><button class="btn">Save Product</button></form><h2>Manage Products</h2><div id="productsList">Loading...</div>`;document.getElementById("productForm").addEventListener("submit",addProduct);db.collection("products").orderBy("name").onSnapshot(s=>{productsCache=s.docs.map(d=>({id:d.id,...d.data()}));document.getElementById("productsList").innerHTML=productsCache.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.category)} · ₹${p.price} · Stock ${p.stock??0} · ${p.active?"Visible":"Hidden"}</div></div><div><button class="btn secondary" onclick="price('${p.id}',${Number(p.price)})">Price</button> <button class="btn secondary" onclick="toggle('${p.id}',${!!p.active})">${p.active?"Hide":"Show"}</button> <button class="btn secondary" onclick="removeProduct('${p.id}')">Delete</button></div></div>`).join("")||"No products yet."},e=>{document.getElementById("productsList").textContent=e.message})}}
async function addProduct(e){e.preventDefault();let f=new FormData(e.target);try{await db.collection("products").add({name:f.get("name"),category:f.get("category"),price:Number(f.get("price")),stock:Number(f.get("stock")||0),emoji:f.get("emoji")||"🛒",image:f.get("image")||"",active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});e.target.reset()}catch(err){alert(err.message)}}
async function price(id,old){let v=prompt("Enter new price",old);if(v!==null&&!isNaN(v)&&v.trim()!=="")await db.collection("products").doc(id).update({price:Number(v)})}
async function toggle(id,active){await db.collection("products").doc(id).update({active:!active})}
async function removeProduct(id){if(confirm("Delete this product?"))await db.collection("products").doc(id).delete()}
async function status(id,value){await db.collection("orders").doc(id).update({status:value})}
init();
</script></body></html>
